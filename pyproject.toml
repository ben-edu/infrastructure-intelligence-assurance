[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-intelligence-assurance"
version = "0.5.0"
description = "Evidence-first infrastructure history, diff, drift, topology, and planning context"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "jsonschema>=4.20,<5",
  "pytest>=8,<10",
]

[project.scripts]
iia-k8s-inventory = "infra_assurance.kubernetes_runtime:main"
iia-k8s-preflight = "infra_assurance.planning_preflight:main"
iia-k8s-history = "infra_assurance.history_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
