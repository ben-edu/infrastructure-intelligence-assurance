[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-intelligence-assurance"
version = "0.14.0"
description = "Evidence-first infrastructure history, Git drift, workload inventory, observability intelligence, validated alert scope, Kubernetes routing ownership evidence, incident grouping, and planning context"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "jsonschema>=4.20,<5",
  "pytest>=8,<10",
]

[project.scripts]
iia-k8s-inventory = "infra_assurance.kubernetes_runtime:main"
iia-k8s-preflight = "infra_assurance.planning_preflight:main"
iia-k8s-history = "infra_assurance.history_cli:main"
iia-git-source = "infra_assurance.git_declared_observer:main"
iia-inventory = "infra_assurance.inventory_cli:main"
iia-incident-candidates = "infra_assurance.incident_runtime:main"
iia-routing-ownership = "infra_assurance.routing_ownership:main"
iia-alert-scope = "infra_assurance.alert_scope_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
