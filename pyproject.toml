[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-intelligence-assurance"
version = "0.20.0"
description = "Evidence-first infrastructure intelligence, observability drill-down, and backup/recovery assurance foundations"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "jsonschema>=4.20,<5",
  "pytest>=8,<10",
]

[project.scripts]
iia-k8s-inventory = "infra_assurance.kubernetes_runtime:main"
iia-k8s-preflight = "infra_assurance.planning_preflight:main"
iia-k8s-history = "infra_assurance.history_cli:main"
iia-git-source = "infra_assurance.git_declared_observer:main"
iia-inventory = "infra_assurance.inventory_cli:main"
iia-incident-candidates = "infra_assurance.incident_runtime:main"
iia-routing-ownership = "infra_assurance.routing_ownership:main"
iia-alert-scope = "infra_assurance.alert_scope_runtime:main"
iia-routing-context = "infra_assurance.routing_context_integration:main"
iia-scope-aware-drilldown = "infra_assurance.scope_aware_drilldown:main"
iia-prometheus-rule-context = "infra_assurance.prometheus_rule_context:main"
iia-prometheus-rule-integration = "infra_assurance.prometheus_rule_context_integration:main"
iia-backup-assurance-foundation = "infra_assurance.backup_assurance_foundation:main"
iia-proxmox-ve-backup-evidence = "infra_assurance.proxmox_ve_backup_evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
