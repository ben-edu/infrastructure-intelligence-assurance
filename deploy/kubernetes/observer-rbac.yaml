apiVersion: v1
kind: Namespace
metadata:
  name: infra-assurance-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-assurance-observer
  namespace: infra-assurance-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-assurance-observer
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - services
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-assurance-observer
subjects:
  - kind: ServiceAccount
    name: infra-assurance-observer
    namespace: infra-assurance-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-assurance-observer
---
apiVersion: v1
kind: Secret
metadata:
  name: infra-assurance-observer-token
  namespace: infra-assurance-system
  annotations:
    kubernetes.io/service-account.name: infra-assurance-observer
type: kubernetes.io/service-account-token
